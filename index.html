<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>校边爆款零食推荐</title>
  <style>
    :root {
      --primary: #FF6B35;
      --primary-light: #FF8C42;
      --secondary: #F7C948;
      --bg: #FFF9F5;
      --card: #FFFFFF;
      --text: #1A1A1A;
      --text-sub: #666;
      --text-muted: #AAA;
      --border: #FFE0CC;
      --tag-bg: #FFF3EC;
      --green: #16A34A;
      --shadow: 0 2px 10px rgba(255,107,53,0.1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 640px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* ===== HEADER ===== */
    .header {
      background: linear-gradient(135deg, #FF5A1F 0%, #FF8C42 60%, #FFAD60 100%);
      color: #fff;
      padding: 20px 16px 28px;
      position: relative;
      overflow: hidden;
    }
    .header-deco {
      position: absolute;
      right: 12px;
      top: 12px;
      font-size: 52px;
      opacity: 0.18;
      transform: rotate(12deg);
      line-height: 1;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.25);
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; letter-spacing: 0.3px; }
    .header p { font-size: 12px; opacity: 0.9; line-height: 1.6; max-width: 260px; }

    /* ===== STATS ===== */
    .stats {
      display: flex;
      background: var(--primary);
      color: #fff;
    }
    .stat { flex: 1; text-align: center; padding: 10px 4px; }
    .stat-n { font-size: 20px; font-weight: 800; line-height: 1; }
    .stat-l { font-size: 10px; opacity: 0.85; margin-top: 2px; }

    /* ===== SEARCH ===== */
    .sticky-top {
      position: sticky;
      top: 0;
      z-index: 200;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    .search-box {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-box input {
      flex: 1;
      padding: 9px 14px 9px 36px;
      border: 1.5px solid var(--border);
      border-radius: 24px;
      font-size: 14px;
      background: var(--bg);
      outline: none;
      color: var(--text);
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--primary); }
    .search-wrap { position: relative; flex: 1; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 15px; pointer-events: none; }
    .clear-btn {
      display: none;
      background: var(--border);
      border: none;
      border-radius: 50%;
      width: 22px; height: 22px;
      font-size: 12px;
      cursor: pointer;
      color: var(--text-sub);
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      align-items: center;
      justify-content: center;
    }
    .clear-btn.visible { display: flex; }

    /* ===== TABS ===== */
    .tabs {
      display: flex;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 0 8px;
      background: #fff;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0;
      padding: 10px 14px;
      border: none;
      background: none;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-sub);
      cursor: pointer;
      border-bottom: 2.5px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 700; }
    .tab .cnt {
      display: inline-block;
      background: var(--border);
      color: var(--text-sub);
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 8px;
      margin-left: 3px;
      font-weight: 600;
    }
    .tab.active .cnt { background: var(--primary); color: #fff; }

    /* ===== SECTIONS ===== */
    .section { display: none; padding: 12px 14px 80px; }
    .section.active { display: block; }

    /* ===== DETAIL CARD (S1–S3) ===== */
    .d-card {
      background: var(--card);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
    }
    .d-card:active { transform: scale(0.99); transition: transform 0.1s; }
    .d-top { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
    .d-num {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 10px;
      flex-shrink: 0;
      min-width: 30px;
      text-align: center;
      margin-top: 2px;
    }
    .d-name { font-size: 15px; font-weight: 700; line-height: 1.4; flex: 1; }
    .price-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .p-cell {
      background: var(--tag-bg);
      border-radius: 9px;
      padding: 7px 4px;
      text-align: center;
    }
    .p-label { font-size: 10px; color: var(--text-muted); margin-bottom: 3px; }
    .p-val { font-size: 13px; font-weight: 700; color: var(--text); }
    .p-val.cost { color: var(--primary); }
    .p-val.sell { color: #2563EB; }
    .p-val.profit { color: var(--green); }
    .d-note {
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.5;
      background: #F8F6F0;
      border-left: 3px solid var(--secondary);
      padding: 6px 10px;
      border-radius: 0 6px 6px 0;
      margin-bottom: 10px;
    }
    .d-actions { display: flex; gap: 8px; }
    .btn-pdd {
      flex: 1;
      display: block;
      text-align: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 10px;
      border-radius: 9px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
    .btn-copy {
      padding: 9px 14px;
      background: var(--tag-bg);
      color: var(--primary);
      border: 1.5px solid var(--border);
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-search-pdd {
      display: block;
      text-align: center;
      background: #F5F5F0;
      color: var(--text-sub);
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 9px;
      text-decoration: none;
      cursor: pointer;
      border: 1.5px dashed var(--border);
      width: 100%;
    }

    /* ===== SIMPLE CARD (S4–S5) ===== */
    .s-card {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow);
    }
    .s-num {
      background: var(--tag-bg);
      color: var(--primary);
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .s-name { font-size: 14px; font-weight: 500; flex: 1; line-height: 1.4; color: var(--text); }
    .s-link {
      color: var(--primary);
      font-size: 12px;
      text-decoration: none;
      font-weight: 600;
      white-space: nowrap;
      background: var(--tag-bg);
      padding: 5px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .s-link:active { background: var(--primary); color: #fff; }
    .s-note-small { font-size: 11px; color: var(--text-muted); line-height: 1.3; }

    /* ===== BRAND SECTION (S6) ===== */
    .brand-block { margin-bottom: 18px; }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      padding: 8px 12px;
      background: linear-gradient(90deg, rgba(255,107,53,0.08), transparent);
      border-left: 4px solid var(--primary);
      border-radius: 0 8px 8px 0;
      margin-bottom: 10px;
    }
    .tag-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 6px 13px;
      font-size: 13px;
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .tag-note { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* ===== SEARCH RESULTS ===== */
    #search-section { display: none; padding: 12px 14px 80px; }
    .result-count { font-size: 12px; color: var(--text-sub); margin-bottom: 10px; padding: 2px 0; }
    .result-badge {
      display: inline-block;
      background: var(--tag-bg);
      color: var(--primary);
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 8px;
      margin-left: 6px;
      font-weight: 600;
    }
    mark { background: rgba(255,107,53,0.18); border-radius: 2px; color: inherit; }

    /* ===== EMPTY STATE ===== */
    .empty { text-align: center; padding: 48px 20px; color: var(--text-muted); }
    .empty-emoji { font-size: 44px; margin-bottom: 12px; }
    .empty p { font-size: 14px; }

    /* ===== TOAST ===== */
    #toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgba(20,20,20,0.82);
      color: #fff;
      padding: 9px 22px;
      border-radius: 22px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== SECTION SUBTITLE ===== */
    .section-tip {
      font-size: 12px;
      color: var(--text-sub);
      background: #FFF8F0;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .section-tip strong { color: var(--primary); }
  </style>
</head>

// ============================================================
// RENDER HELPERS
// ============================================================
function fmt(n) { return n != null ? n.toFixed(2) : '—'; }

function profitColor(p) {
  if (p == null) return '';
  return p >= 0.4 ? 'profit' : (p >= 0.2 ? 'sell' : 'cost');
}

function renderDetailCard(item, idx) {
  const profit = (item.sellPrice != null && item.unitCost != null)
    ? (item.sellPrice - item.unitCost).toFixed(2) : null;
  const profitCls = profit != null ? profitColor(parseFloat(profit)) : '';

  const actionHtml = item.url
    ? `<a class="btn-pdd" href="${item.url}" target="_blank">🛒 去拼多多</a>
       <button class="btn-copy" onclick="copyLink('${item.url}', this)">复制</button>`
    : `<span class="btn-search-pdd">🔎 拼多多自行搜索</span>`;

  const priceHtml = (item.boxPrice != null)
    ? `<div class="price-grid">
        <div class="p-cell"><div class="p-label">进货价</div><div class="p-val cost">¥${fmt(item.boxPrice)}</div></div>
        <div class="p-cell"><div class="p-label">数量</div><div class="p-val">${item.qty}包</div></div>
        <div class="p-cell"><div class="p-label">单包成本</div><div class="p-val cost">¥${fmt(item.unitCost)}</div></div>
        <div class="p-cell"><div class="p-label">建议售价</div><div class="p-val ${profit != null ? 'sell' : ''}">
          ${item.sellPrice != null ? '¥'+item.sellPrice : '待定'}</div></div>
      </div>
      ${profit != null ? `<div class="price-grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px">
        <div class="p-cell"><div class="p-label">每包利润</div><div class="p-val ${profitCls}">+¥${profit}</div></div>
        <div class="p-cell"><div class="p-label">利润率</div><div class="p-val ${profitCls}">${Math.round(parseFloat(profit)/item.sellPrice*100)}%</div></div>
      </div>` : ''}` : '';

  return `<div class="d-card" data-name="${item.name}">
    <div class="d-top">
      <span class="d-num">No.${idx+1}</span>
      <span class="d-name">${item.name}</span>
    </div>
    ${priceHtml}
    ${item.note ? `<div class="d-note">💬 ${item.note}</div>` : ''}
    <div class="d-actions">${actionHtml}</div>
  </div>`;
}

function renderSimpleCard(item, idx) {
  const linkHtml = item.url
    ? `<a class="s-link" href="${item.url}" target="_blank">去购买</a>`
    : `<span style="font-size:11px;color:#bbb">自行搜索</span>`;
  return `<div class="s-card" data-name="${item.name}">
    <span class="s-num">${idx+1}</span>
    <span class="s-name">${item.name}</span>
    ${linkHtml}
  </div>`;
}

function renderBrandBlock(brand) {
  const tags = brand.items.map(i => `<span class="tag">${i}</span>`).join('');
  return `<div class="brand-block">
    <div class="brand-title">🏷️ ${brand.brand}</div>
    <div class="tag-list">${tags}</div>
  </div>`;
}

function initTabs() {
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      if (document.getElementById('searchInput').value.trim()) return;
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });
}

// ============================================================
// SEARCH
// ============================================================
const allItems = [
  ...s1.map((it, i) => ({ ...it, section: '第一批', sId: 1, idx: i })),
  ...s2.map((it, i) => ({ ...it, section: '第二批', sId: 2, idx: i })),
  ...s3.map((it, i) => ({ ...it, section: '第三批', sId: 3, idx: i })),
  ...s4.map((it, i) => ({ ...it, section: '第四批', sId: 4, idx: i })),
  ...s5.map((it, i) => ({ ...it, section: '第五批', sId: 5, idx: i })),
  ...s6.flatMap(b => b.items.map(name => ({ name, url: null, section: '厂家源头', sId: 6, brand: b.brand, idx: 0 }))),
];

function highlight(text, kw) {
  if (!kw) return text;
  const re = new RegExp('(' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

function renderSearchResult(item, kw) {
  const name = highlight(item.name, kw);
  const badge = `<span class="result-badge">${item.section}</span>`;
  if (item.sId <= 3) {
    const profit = (item.sellPrice != null && item.unitCost != null)
      ? '+¥' + (item.sellPrice - item.unitCost).toFixed(2) : '';
    const priceRow = item.boxPrice
      ? `<div style="font-size:12px;color:var(--text-sub);margin:6px 0">
          ¥${fmt(item.boxPrice)} / ${item.qty}包 · 成本 ¥${fmt(item.unitCost)} · 售 ¥${item.sellPrice||'?'}
          ${profit ? `<span style="color:var(--green);font-weight:700;margin-left:6px">${profit}</span>` : ''}
        </div>` : '';
    const link = item.url
      ? `<a class="btn-pdd" href="${item.url}" target="_blank" style="font-size:12px;padding:6px 10px">🛒 去购买</a>`
      : `<span style="color:#bbb;font-size:12px">拼多多自行搜索</span>`;
    return `<div class="d-card">
      <div class="d-top"><span class="d-name">${name}</span>${badge}</div>
      ${priceRow}
      <div class="d-actions">${link}</div>
    </div>`;
  } else if (item.sId <= 5) {
    const link = item.url
      ? `<a class="s-link" href="${item.url}" target="_blank">去购买</a>`
      : '';
    return `<div class="s-card">
      <span class="s-name">${name} ${badge}</span>${link}
    </div>`;
  } else {
    return `<div class="s-card">
      <span class="s-name">${name} ${badge}</span>
      <span style="font-size:11px;color:var(--text-muted)">${item.brand||''}</span>
    </div>`;
  }
}

function doSearch(kw) {
  const ssec = document.getElementById('search-section');
  const tabs = document.querySelectorAll('.section');
  const tabBtns = document.querySelectorAll('.tab');
  if (!kw) {
    ssec.style.display = 'none';
    const activeTab = document.querySelector('.tab.active');
    const activeId = activeTab ? activeTab.dataset.tab : 's1';
    tabs.forEach(s => s.classList.remove('active'));
    document.getElementById(activeId).classList.add('active');
    return;
  }
  tabs.forEach(s => s.classList.remove('active'));
  ssec.style.display = 'block';
  const results = allItems.filter(it => it.name.includes(kw));
  document.getElementById('resultCount').innerHTML =
    `找到 <strong>${results.length}</strong> 个结果，关键词：<strong>${kw}</strong>`;
  document.getElementById('searchResults').innerHTML = results.length
    ? results.map(it => renderSearchResult(it, kw)).join('')
    : `<div class="empty"><div class="empty-emoji">🤷</div><p>没有找到"${kw}"相关零食</p></div>`;
}

function initSearch() {
  const input = document.getElementById('searchInput');
  const clear = document.getElementById('clearBtn');
  let timer;
  input.addEventListener('input', () => {
    clearTimeout(timer);
    const kw = input.value.trim();
    clear.classList.toggle('visible', kw.length > 0);
    timer = setTimeout(() => doSearch(kw), 300);
  });
  clear.addEventListener('click', () => {
    input.value = '';
    clear.classList.remove('visible');
    doSearch('');
  });
}

// ============================================================
// COPY LINK
// ============================================================
function copyLink(url, btn) {
  navigator.clipboard.writeText(url).then(() => {
    showToast('链接已复制 ✓');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('链接已复制 ✓');
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ============================================================
// BOOT

initSections();
initTabs();
initSearch();
